spring.application.name=homelyhub-backend
server.port=4000

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/homelyhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=HomelyHubSecretKeyForDevelopmentOnly123456789SecretKeySuperSecure2026
app.jwt.expiration=86400000

# Frontend URL for CORS
app.frontend.url=http://localhost:5173
